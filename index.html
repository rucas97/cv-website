    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    // ---------- STATE ----------
    let scene, camera, renderer, controls, raycaster, mouse;
    let organelles = {};      // clickable groups
    let membrane, particles;
    let hovered = null, activeTarget = null, transitioning = false;
    let tweenHandle = null;
    const DEFAULT_POS = new THREE.Vector3(0, 5, 60);
    const DEFAULT_LOOK = new THREE.Vector3(0, 0, 0);

    // ---------- NOISE (pseudo-random organic displacement) ----------
    function noise(x, y, z) {
      return (Math.sin(x*1.7)*Math.cos(y*1.3)*Math.sin(z*1.9)*0.5
            + Math.sin(x*4.1)*Math.cos(y*3.7)*Math.sin(z*4.3)*0.3
            + Math.sin(x*8.5)*Math.cos(y*7.1)*Math.sin(z*8.3)*0.15);
    }

    // ---------- DISPLACED GEOMETRY ----------
    function organicSphere(radius, detail, amp, freq) {
      const geo = new THREE.IcosahedronGeometry(radius, detail);
      const pos = geo.attributes.position;
      const v = new THREE.Vector3();
      for (let i = 0; i < pos.count; i++) {
        v.set(pos.getX(i), pos.getY(i), pos.getZ(i));
        const n = noise(v.x*freq, v.y*freq, v.z*freq);
        v.multiplyScalar(1 + n * amp);
        pos.setXYZ(i, v.x, v.y, v.z);
      }
      geo.computeVertexNormals();
      return geo;
    }

    // ---------- INIT ----------
    window.onload = () => {
      try {
        initScene();
        buildCell();
        setupEvents();
        animate();
        setTimeout(() => {
          const l = document.getElementById('loading-screen');
          l.style.opacity = '0';
          setTimeout(() => l.remove(), 600);
        }, 400);
      } catch (err) {
        document.getElementById('error-msg').innerHTML = "Error: " + err.message;
        console.error(err);
      }
    };

    function initScene() {
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x030712, 0.007);

      camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 2000);
      camera.position.copy(DEFAULT_POS);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.setClearColor(0x030712, 1);
      renderer.domElement.style.touchAction = 'none';
      document.getElementById('webgl-container').appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.rotateSpeed = 0.7;
      controls.zoomSpeed = 1.1;
      controls.panSpeed = 0.7;
      controls.minDistance = 15;
      controls.maxDistance = 130;

      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      // Lighting (bioluminescent palette)
      scene.add(new THREE.AmbientLight(0x1a2540, 1.2));
      const L1 = new THREE.PointLight(0x06b6d4, 2.5, 150); L1.position.set(0, 0, 0); scene.add(L1);
      const L2 = new THREE.PointLight(0x10b981, 2.0, 100); L2.position.set(-40, 30, 30); scene.add(L2);
      const L3 = new THREE.PointLight(0x8b5cf6, 1.8, 100); L3.position.set(40, -30, -30); scene.add(L3);
    }

    // ---------- BUILD CELL ----------
    function buildCell() {
      // --- CELL MEMBRANE (organic, semi-transparent) ---
      const memGeo = organicSphere(55, 3, 0.03, 0.03);
      const memMat = new THREE.MeshPhongMaterial({
        color: 0x1e3a8a, emissive: 0x1e40af, emissiveIntensity: 0.15,
        transparent: true, opacity: 0.08, side: THREE.BackSide,
        shininess: 30, wireframe: false
      });
      membrane = new THREE.Mesh(memGeo, memMat);
      scene.add(membrane);

      // Membrane wireframe overlay for texture
      const wireGeo = new THREE.IcosahedronGeometry(55, 2);
      const wireMat = new THREE.MeshBasicMaterial({ color: 0x1e40af, wireframe: true, transparent: true, opacity: 0.06 });
      scene.add(new THREE.Mesh(wireGeo, wireMat));

      // --- CYTOSOL PARTICLES (proteins, ions) ---
      const pCount = 900;
      const pGeo = new THREE.BufferGeometry();
      const pPos = new Float32Array(pCount * 3);
      const pCol = new Float32Array(pCount * 3);
      const c = new THREE.Color();
      for (let i = 0; i < pCount; i++) {
        const r = 52 * Math.cbrt(Math.random());
        const t = Math.random() * Math.PI * 2;
        const p = Math.acos(2*Math.random() - 1);
        pPos[i*3] = r * Math.sin(p) * Math.cos(t);
        pPos[i*3+1] = r * Math.sin(p) * Math.sin(t);
        pPos[i*3+2] = r * Math.cos(p);
        c.setHSL(0.5 + Math.random()*0.25, 0.7, 0.55);
        pCol[i*3] = c.r; pCol[i*3+1] = c.g; pCol[i*3+2] = c.b;
      }
      pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
      pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
      particles = new THREE.Points(pGeo, new THREE.PointsMaterial({
        size: 0.55, vertexColors: true, transparent: true, opacity: 0.55,
        blending: THREE.AdditiveBlending, depthWrite: false
      }));
      scene.add(particles);

      // --- NUCLEUS ---
      const nucleus = new THREE.Group();
      // Outer nuclear envelope
      const envGeo = organicSphere(12, 4, 0.04, 0.15);
      const envMat = new THREE.MeshPhongMaterial({
        color: 0x0ea5e9, emissive: 0x0284c7, emissiveIntensity: 0.6,
        transparent: true, opacity: 0.35, shininess: 80, side: THREE.DoubleSide
      });
      const env = new THREE.Mesh(envGeo, envMat);
      nucleus.add(env);
      // Nuclear pores (small rings)
      for (let i = 0; i < 40; i++) {
        const pore = new THREE.Mesh(
          new THREE.TorusGeometry(0.4, 0.1, 6, 12),
          new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.7 })
        );
        // Place on sphere surface
        const phi = Math.acos(2 * Math.random() - 1);
        const theta = Math.random() * Math.PI * 2;
        const r = 11.8;
        pore.position.set(r*Math.sin(phi)*Math.cos(theta), r*Math.sin(phi)*Math.sin(theta), r*Math.cos(phi));
        pore.lookAt(0, 0, 0);
        nucleus.add(pore);
      }
      // Inner chromatin fibers
      for (let i = 0; i < 10; i++) {
        const pts = [];
        let x = 0, y = 0, z = 0;
        for (let j = 0; j < 20; j++) {
          x += (Math.random() - 0.5) * 2.2;
          y += (Math.random() - 0.5) * 2.2;
          z += (Math.random() - 0.5) * 2.2;
          const len = Math.sqrt(x*x + y*y + z*z);
          if (len > 8.5) { x *= 8.5/len; y *= 8.5/len; z *= 8.5/len; }
          pts.push(new THREE.Vector3(x, y, z));
        }
        const curve = new THREE.CatmullRomCurve3(pts);
        const tube = new THREE.TubeGeometry(curve, 60, 0.12, 6, false);
        const fiber = new THREE.Mesh(tube, new THREE.MeshBasicMaterial({
          color: 0x38bdf8, transparent: true, opacity: 0.75
        }));
        nucleus.add(fiber);
      }
      // Inner nucleolus
      const nucleolus = new THREE.Mesh(
        new THREE.IcosahedronGeometry(3, 2),
        new THREE.MeshPhongMaterial({ color: 0x0369a1, emissive: 0x0c4a6e, emissiveIntensity: 0.8, transparent: true, opacity: 0.7 })
      );
      nucleolus.position.set(2, -1, 1);
      nucleus.add(nucleolus);

      scene.add(nucleus);
      organelles.nucleus = { group: nucleus, focus: new THREE.Vector3(0, 4, 28), hit: env };

      // --- MITOCHONDRIA (multiple, scattered) ---
      const mitoPositions = [new THREE.Vector3(-22, 14, -8), new THREE.Vector3(20, -18, 6), new THREE.Vector3(-8, -22, 15)];
      let firstMito = null;
      mitoPositions.forEach((pos, idx) => {
        const mito = makeMitochondrion();
        mito.position.copy(pos);
        mito.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
        scene.add(mito);
        if (idx === 0) firstMito = mito;
      });
      organelles.mitochondria = { group: firstMito, focus: new THREE.Vector3(-22, 20, 22), hit: firstMito.children[0] };

      // --- GOLGI ---
      const golgi = makeGolgi();
      golgi.position.set(24, 18, -10);
      scene.add(golgi);
      organelles.golgi = { group: golgi, focus: new THREE.Vector3(24, 22, 20), hit: golgi.children[0] };

      // --- CYTOSKELETON (long crossing filaments) ---
      const cytoskel = makeCytoskeleton();
      scene.add(cytoskel);
      organelles.cytoskeleton = { group: cytoskel, focus: new THREE.Vector3(0, 5, 80), hit: cytoskel.children[0] };

      // --- ENDOPLASMIC RETICULUM (ambient, not clickable) ---
      scene.add(makeER());

      // --- LYSOSOMES & VESICLES (ambient) ---
      for (let i = 0; i < 12; i++) {
        const ves = new THREE.Mesh(
          new THREE.SphereGeometry(0.4 + Math.random()*0.8, 12, 12),
          new THREE.MeshPhongMaterial({
            color: 0xd946ef, emissive: 0x86198f, emissiveIntensity: 0.6,
            transparent: true, opacity: 0.8
          })
        );
        ves.position.set(
          (Math.random()-0.5) * 60,
          (Math.random()-0.5) * 60,
          (Math.random()-0.5) * 60
        );
        scene.add(ves);
      }
    }

    function makeMitochondrion() {
      const g = new THREE.Group();
      // Organic capsule via displaced sphere scaled along Y
      const geo = organicSphere(2.5, 3, 0.15, 0.5);
      geo.scale(1, 2.2, 1);
      const outer = new THREE.Mesh(geo, new THREE.MeshPhongMaterial({
        color: 0x10b981, emissive: 0x047857, emissiveIntensity: 0.5,
        transparent: true, opacity: 0.55, shininess: 60, side: THREE.DoubleSide
      }));
      g.add(outer);
      // Cristae (wavy membrane folds inside)
      for (let i = 0; i < 5; i++) {
        const pts = [];
        for (let j = 0; j <= 15; j++) {
          const t = j / 15;
          pts.push(new THREE.Vector3(
            Math.sin(t * Math.PI * 3 + i) * 1.6,
            (t - 0.5) * 8,
            Math.cos(t * Math.PI * 2 + i) * 1.6
          ));
        }
        const curve = new THREE.CatmullRomCurve3(pts);
        const crista = new THREE.Mesh(
          new THREE.TubeGeometry(curve, 40, 0.14, 6, false),
          new THREE.MeshBasicMaterial({ color: 0x34d399, transparent: true, opacity: 0.85 })
        );
        g.add(crista);
      }
      return g;
    }

    function makeGolgi() {
      const g = new THREE.Group();
      const mat = new THREE.MeshPhongMaterial({
        color: 0xf59e0b, emissive: 0xb45309, emissiveIntensity: 0.6,
        side: THREE.DoubleSide, transparent: true, opacity: 0.85, shininess: 50
      });
      // Stacked cisternae (curved flattened sacs)
      for (let i = 0; i < 6; i++) {
        const geo = new THREE.TorusGeometry(3.2 + i * 0.7, 0.55, 8, 40, Math.PI * 1.3);
        const sac = new THREE.Mesh(geo, mat);
        sac.rotation.x = Math.PI / 2 + i * 0.12;
        sac.rotation.y = i * 0.18;
        sac.position.y = i * 1.0;
        sac.scale.set(1, 1, 0.35);
        g.add(sac);
      }
      // Budding vesicles
      for (let i = 0; i < 20; i++) {
        const ves = new THREE.Mesh(
          new THREE.SphereGeometry(0.18 + Math.random() * 0.22, 8, 8),
          new THREE.MeshPhongMaterial({ color: 0xfbbf24, emissive: 0xf59e0b, emissiveIntensity: 0.9, transparent: true, opacity: 0.9 })
        );
        const theta = Math.random() * Math.PI * 2;
        const r = 6 + Math.random() * 4;
        ves.position.set(Math.cos(theta) * r, (Math.random() - 0.5) * 8, Math.sin(theta) * r);
        g.add(ves);
      }
      return g;
    }

    function makeCytoskeleton() {
      const g = new THREE.Group();
      const colors = [0x8b5cf6, 0xa78bfa, 0xc4b5fd];
      for (let i = 0; i < 18; i++) {
        const start = new THREE.Vector3(
          (Math.random() - 0.5) * 90,
          (Math.random() - 0.5) * 90,
          (Math.random() - 0.5) * 90
        );
        const end = new THREE.Vector3(
          (Math.random() - 0.5) * 90,
          (Math.random() - 0.5) * 90,
          (Math.random() - 0.5) * 90
        );
        const mid = start.clone().add(end).multiplyScalar(0.5);
        mid.x += (Math.random() - 0.5) * 25;
        mid.y += (Math.random() - 0.5) * 25;
        mid.z += (Math.random() - 0.5) * 25;
        const curve = new THREE.CatmullRomCurve3([start, mid, end]);
        const tube = new THREE.TubeGeometry(curve, 40, 0.08, 5, false);
        g.add(new THREE.Mesh(tube, new THREE.MeshBasicMaterial({
          color: colors[Math.floor(Math.random() * colors.length)],
          transparent: true, opacity: 0.55
        })));
      }
      // Ribosome dots along filaments
      for (let i = 0; i < 60; i++) {
        const dot = new THREE.Mesh(
          new THREE.SphereGeometry(0.18, 6, 6),
          new THREE.MeshBasicMaterial({ color: 0xc084fc, transparent: true, opacity: 0.9 })
        );
        dot.position.set(
          (Math.random() - 0.5) * 80,
          (Math.random() - 0.5) * 80,
          (Math.random() - 0.5) * 80
        );
        g.add(dot);
      }
      return g;
    }

    function makeER() {
      const g = new THREE.Group();
      const mat = new THREE.MeshBasicMaterial({ color: 0x0891b2, transparent: true, opacity: 0.35 });
      for (let n = 0; n < 12; n++) {
        const pts = [];
        let x = (Math.random() - 0.5) * 40;
        let y = (Math.random() - 0.5) * 40;
        let z = (Math.random() - 0.5) * 40;
        for (let j = 0; j < 12; j++) {
          x += (Math.random() - 0.5) * 3;
          y += (Math.random() - 0.5) * 3;
          z += (Math.random() - 0.5) * 3;
          pts.push(new THREE.Vector3(x, y, z));
        }
        const curve = new THREE.CatmullRomCurve3(pts);
        const tube = new THREE.TubeGeometry(curve, 50, 0.1, 6, false);
        g.add(new THREE.Mesh(tube, mat));
      }
      return g;
    }

    // ---------- EVENTS ----------
    let downPos = { x: 0, y: 0 };
    function setupEvents() {
      window.addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });

      const canvas = renderer.domElement;
      canvas.addEventListener('pointerdown', e => { downPos = { x: e.clientX, y: e.clientY }; });
      canvas.addEventListener('pointerup', e => {
        // Only click if pointer didn't drag
        if (Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) > 6) return;
        if (transitioning || activeTarget) return;
        if (!document.getElementById('hud-modal').classList.contains('hidden')) return;
        handleClick(e);
      });
      canvas.addEventListener('pointermove', handleHover);
    }

    function handleHover(e) {
      if (activeTarget || transitioning) return;
      mouse.x = (e.clientX / innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      let newHover = null;
      for (const key in organelles) {
        const hits = raycaster.intersectObject(organelles[key].group, true);
        if (hits.length > 0) { newHover = key; break; }
      }

      if (newHover !== hovered) {
        hovered = newHover;
        renderer.domElement.style.cursor = hovered ? 'pointer' : 'grab';
      }
    }

    function handleClick(e) {
      mouse.x = (e.clientX / innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      for (const key in organelles) {
        const hits = raycaster.intersectObject(organelles[key].group, true);
        if (hits.length > 0) { flyTo(key); return; }
      }
    }

    // ---------- CAMERA FLY ----------
    function flyTo(key) {
      const org = organelles[key];
      if (!org || transitioning) return;
      activeTarget = key;
      transitioning = true;
      controls.enabled = false;

      tweenCamera(org.focus, org.group.position, 900, () => {
        transitioning = false;
        openModal(key);
      });
    }

    function resetView() {
      if (transitioning) return;
      activeTarget = null;
      transitioning = true;
      controls.enabled = false;
      closeModal(true);
      tweenCamera(DEFAULT_POS, DEFAULT_LOOK, 900, () => {
        transitioning = false;
      });
    }

    function tweenCamera(toPos, toLook, duration, onDone) {
      if (tweenHandle) tweenHandle.cancelled = true;
      const handle = { cancelled: false };
      tweenHandle = handle;

      const fromPos = camera.position.clone();
      const fromLook = controls.target.clone();
      const startT = performance.now();

      function step(now) {
        if (handle.cancelled) return;
        const t = Math.min((now - startT) / duration, 1);
        const ease = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
        camera.position.lerpVectors(fromPos, toPos, ease);
        controls.target.lerpVectors(fromLook, toLook, ease);
        controls.update();
        if (t < 1) requestAnimationFrame(step);
        else { controls.enabled = true; tweenHandle = null; onDone && onDone(); }
      }
      requestAnimationFrame(step);
    }

    // ---------- MODAL ----------
    function openModal(key) {
      const d = CELL_DATA[key];
      if (!d) return;
      document.getElementById('m-title').textContent = d.title;
      document.getElementById('m-subtitle').textContent = d.subtitle;
      document.getElementById('m-subtitle').className = `text-[11px] font-mono tracking-widest uppercase ${d.color}`;
      document.getElementById('m-body').innerHTML = d.content;
      document.getElementById('m-icon').className = `fa-solid ${d.icon}`;
      document.getElementById('m-status').textContent = d.status;
      document.getElementById('m-icon-cont').className = `w-12 h-12 rounded-xl flex items-center justify-center text-xl ${d.bg} ${d.color} border ${d.border}`;

      const modal = document.getElementById('hud-modal');
      const card = document.getElementById('hud-card');
      modal.classList.remove('hidden');
      void card.offsetWidth; // reflow
      card.classList.remove('opacity-0', 'scale-95');
      card.classList.add('opacity-100', 'scale-100');
    }

    function closeModal(silent) {
      const modal = document.getElementById('hud-modal');
      if (modal.classList.contains('hidden')) return;
      const card = document.getElementById('hud-card');
      card.classList.remove('opacity-100', 'scale-100');
      card.classList.add('opacity-0', 'scale-95');
      setTimeout(() => modal.classList.add('hidden'), 300);
      if (!silent) {
        activeTarget = null;
        if (!transitioning) {
          transitioning = true;
          controls.enabled = false;
          tweenCamera(DEFAULT_POS, DEFAULT_LOOK, 900, () => { transitioning = false; });
        }
      }
    }

    // ---------- TOOLTIPS ----------
    function updateTooltips() {
      for (const key in organelles) {
        const tip = document.getElementById('tip-' + key);
        if (!tip) continue;
        if (activeTarget) { tip.style.opacity = '0'; continue; }
        const v = new THREE.Vector3();
        organelles[key].group.getWorldPosition(v);
        v.y += 6;
        v.project(camera);
        if (v.z > 1) { tip.style.opacity = '0'; continue; }
        tip.style.left = ((v.x * 0.5 + 0.5) * innerWidth) + 'px';
        tip.style.top = ((-(v.y * 0.5) + 0.5) * innerHeight) + 'px';
        tip.style.opacity = '0.9';
      }
    }

    // ---------- LOOP ----------
    let t0 = 0;
    function animate(now) {
      requestAnimationFrame(animate);
      const t = (now || 0) * 0.001;

      // Organic animations
      if (organelles.nucleus) {
        organelles.nucleus.group.rotation.y = t * 0.12;
        const breathe = 1 + Math.sin(t * 1.4) * 0.015;
        organelles.nucleus.group.scale.setScalar(breathe);
      }
      if (organelles.mitochondria) organelles.mitochondria.group.rotation.y = t * 0.25;
if (organelles.golgi) organelles.golgi.group.rotation.y = t * 0.15;
      if (organelles.cytoskeleton) organelles.cytoskeleton.group.rotation.y = t * 0.05;
      if (particles) particles.rotation.y = t * 0.02;
      if (membrane) membrane.rotation.y = t * 0.01;

      controls.update();
      updateTooltips();
      renderer.render(scene, camera);
    }
  </script>
</body>
