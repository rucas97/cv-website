      <!-- Loading ONLY the essential libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  
  <script>
    // Error Catcher
    window.addEventListener('error', function(e) {
      const errDiv = document.getElementById('error-msg');
      if (errDiv && e.message) {
        errDiv.innerHTML = "Error: " + e.message + "<br>Please check your internet connection or VPN.";
      }
    }, true);

    let scene, camera, renderer, controls;
    let organelles = {};
    let cytosolParticles;
    let raycaster, mouse;
    let hoveredObj = null;
    let activeTarget = null;
    let isTransitioning = false;

    window.onload = function() {
      try {
        initScene();
        createCellEnvironment();
        createOrganelles();
        setupEvents();
        animate();

        setTimeout(() => {
          const loader = document.getElementById('loading-screen');
          loader.style.opacity = '0';
          setTimeout(() => loader.remove(), 500);
        }, 500);
      } catch (error) {
        document.getElementById('error-msg').innerHTML = "Initialization Error: " + error.message;
        console.error(error);
      }
    };

    function initScene() {
      const container = document.getElementById('webgl-container');
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x030712, 0.008);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 45);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(renderer.domElement);

      // Free-roaming Game Camera
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.rotateSpeed = 0.8;
      controls.zoomSpeed = 1.2;
      controls.minDistance = 10;
      controls.maxDistance = 100;

      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      // Simulated Glow Lighting
      scene.add(new THREE.AmbientLight(0x0f172a, 2.5));
      const light1 = new THREE.PointLight(0x06b6d4, 5, 100); scene.add(light1);
      const light2 = new THREE.PointLight(0x10b981, 3, 80); light2.position.set(-20, 20, 20); scene.add(light2);
      const light3 = new THREE.PointLight(0x8b5cf6, 3, 80); light3.position.set(20, -20, -20); scene.add(light3);
    }

    function createCellEnvironment() {
      const membraneMat = new THREE.MeshBasicMaterial({ color: 0x0284c7, transparent: true, opacity: 0.05, wireframe: true, side: THREE.BackSide });
      scene.add(new THREE.Mesh(new THREE.SphereGeometry(45, 32, 32), membraneMat));

      const particleCount = 800;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);
      const colors = new Float32Array(particleCount * 3);
      const color = new THREE.Color();

      for (let i = 0; i < particleCount; i++) {
        const r = 45 * Math.cbrt(Math.random());
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        positions[i*3] = r * Math.sin(phi) * Math.cos(theta);
        positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
        positions[i*3+2] = r * Math.cos(phi);
        color.setHSL(0.5 + Math.random() * 0.2, 0.8, 0.5);
        colors[i*3] = color.r; colors[i*3+1] = color.g; colors[i*3+2] = color.b;
      }
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({ size: 0.6, vertexColors: true, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending, depthWrite: false });
      cytosolParticles = new THREE.Points(geometry, material);
      scene.add(cytosolParticles);
    }

    function createOrganelles() {
      // 1. NUCLEUS
      const nucleusGroup = new THREE.Group();
      const nucMesh = new THREE.Mesh(new THREE.IcosahedronGeometry(7, 2), new THREE.MeshPhongMaterial({ color: 0x06b6d4, emissive: 0x0891b2, emissiveIntensity: 1.2, transparent: true, opacity: 0.9, wireframe: false }));
      nucleusGroup.add(nucMesh);
      const chromatin = new THREE.Mesh(new THREE.SphereGeometry(5, 16, 16), new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true, transparent: true, opacity: 0.4 }));
      nucleusGroup.add(chromatin);
      scene.add(nucleusGroup);
      organelles.nucleus = { group: nucleusGroup, mesh: nucMesh, camPos: new THREE.Vector3(0, 5, 18) };

      // 2. MITOCHONDRIA
      const mitoGroup = new THREE.Group();
      mitoGroup.position.set(-18, 8, -5);
      const mitoMat = new THREE.MeshPhongMaterial({ color: 0x10b981, emissive: 0x047857, emissiveIntensity: 1.0 });
      const mitoBody = new THREE.Mesh(new THREE.CylinderGeometry(3, 3, 8, 32), mitoMat);
      const mitoTop = new THREE.Mesh(new THREE.SphereGeometry(3, 32, 16, 0, Math.PI*2, 0, Math.PI/2), mitoMat); mitoTop.position.y = 4;
      const mitoBot = new THREE.Mesh(new THREE.SphereGeometry(3, 32, 16, 0, Math.PI*2, Math.PI/2, Math.PI/2), mitoMat); mitoBot.position.y = -4;
      mitoGroup.add(mitoBody, mitoTop, mitoBot);
      mitoGroup.rotation.z = Math.PI/4;
      scene.add(mitoGroup);
      organelles.mitochondria = { group: mitoGroup, mesh: mitoBody, camPos: new THREE.Vector3(-18, 8, 10) };

      // 3. GOLGI
      const golgiGroup = new THREE.Group();
      golgiGroup.position.set(18, -10, -5);
      const golgiMat = new THREE.MeshPhongMaterial({ color: 0xf59e0b, emissive: 0xb45309, emissiveIntensity: 1.0, side: THREE.DoubleSide });
      for(let i=0; i<5; i++) {
        const ribbon = new THREE.Mesh(new THREE.TorusGeometry(4 + i*0.8, 0.4, 8, 32, Math.PI * 1.2), golgiMat);
        ribbon.rotation.x = Math.PI/2 + i*0.1; ribbon.position.y = i * 0.8;
        golgiGroup.add(ribbon);
      }
      scene.add(golgiGroup);
      organelles.golgi = { group: golgiGroup, mesh: golgiGroup.children[0], camPos: new THREE.Vector3(18, -10, 12) };

      // 4. CYTOSKELETON
      const cytoGroup = new THREE.Group();
      cytoGroup.position.set(15, 18, -10);
      const tubeMat = new THREE.MeshBasicMaterial({ color: 0x8b5cf6, transparent: true, opacity: 0.8 });
      for(let i=0; i<6; i++) {
        const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 12, 8), tubeMat);
        tube.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
        cytoGroup.add(tube);
      }
      const riboMat = new THREE.MeshBasicMaterial({ color: 0xc084fc });
      for(let i=0; i<20; i++) {
        const ribo = new THREE.Mesh(new THREE.SphereGeometry(0.4, 8, 8), riboMat);
        ribo.position.set((Math.random()-0.5)*10, (Math.random()-0.5)*10, (Math.random()-0.5)*10);
        cytoGroup.add(ribo);
      }
      scene.add(cytoGroup);
      organelles.cytoskeleton = { group: cytoGroup, mesh: cytoGroup.children[0], camPos: new THREE.Vector3(15, 18, 8) };
    }

    function setupEvents() {
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      const domElem = renderer.domElement;
      let downPos = { x: 0, y: 0 };
      domElem.addEventListener('pointerdown', (e) => { downPos = { x: e.clientX, y: e.clientY }; });
      domElem.addEventListener('pointerup', (e) => {
        if (Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) < 5) onClick(e);
      });
      domElem.addEventListener('pointermove', onPointerMove);
    }

    function onPointerMove(e) {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(scene.children, true);

      let newHovered = null;
      if (intersects.length > 0) {
        let obj = intersects[0].object;
        while (obj.parent && obj.parent !== scene) obj = obj.parent;
        for (let key in organelles) {
          if (organelles[key].group === obj) { newHovered = organelles[key]; break; }
        }
      }

      if (newHovered !== hoveredObj) {
        if (hoveredObj) hoveredObj.mesh.material.emissiveIntensity = 1.0;
        hoveredObj = newHovered;
        if (hoveredObj) {
          hoveredObj.mesh.material.emissiveIntensity = 2.5;
          document.body.style.cursor = 'pointer';
        } else document.body.style.cursor = 'grab';
      }
    }

    function onClick(e) {
      if (activeTarget || isTransitioning) return;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(scene.children, true);

      if (intersects.length > 0) {
        let obj = intersects[0].object;
        while (obj.parent && obj.parent !== scene) obj = obj.parent;
        for (let key in organelles) {
          if (organelles[key].group === obj) { flyToOrganelle(key); break; }
        }
      }
    }

    function flyToOrganelle(key) {
      const organelle = organelles[key];
      if (!organelle) return;
      activeTarget = key; isTransitioning = true;
      controls.enabled = false;
      
      // Animate camera
      const startPos = camera.position.clone();
      const targetPos = organelle.group.position.clone().add(organelle.camPos);
      const startLook = controls.target.clone();
      const targetLook = organelle.group.position.clone();
      
      let progress = 0;
      function animateCamera() {
        progress += 0.03;
        if (progress >= 1) {
          camera.position.copy(targetPos);
          controls.target.copy(targetLook);
          controls.enabled = true;
          isTransitioning = false;
          openHUDModal(key);
          return;
        }
        // Smooth ease-in-out
        const ease = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;
        camera.position.lerpVectors(startPos, targetPos, ease);
        controls.target.lerpVectors(startLook, targetLook, ease);
        requestAnimationFrame(animateCamera);
      }
      animateCamera();
    }

    function resetCameraView() {
      activeTarget = null; isTransitioning = true;
      controls.enabled = false;
      
      const startPos = camera.position.clone();
      const targetPos = new THREE.Vector3(0, 0, 45);
      const startLook = controls.target.clone();
      const targetLook = new THREE.Vector3(0, 0, 0);
      
      let progress = 0;
      function animateReset() {
        progress += 0.04;
        if (progress >= 1) {
          camera.position.copy(targetPos);
          controls.target.copy(targetLook);
          controls.enabled = true;
          isTransitioning = false;
          closeHUDModal();
          return;
        }
        const ease = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;
        camera.position.lerpVectors(startPos, targetPos, ease);
        controls.target.lerpVectors(startLook, targetLook, ease);
        requestAnimationFrame(animateReset);
      }
      animateReset();
    }

    function openHUDModal(key) {
      const data = CELL_DATA[key];
      if (!data) return;
      document.getElementById('modal-title').textContent = data.title;
      document.getElementById('modal-subtitle').textContent = data.subtitle;
      document.getElementById('modal-body').innerHTML = data.content;
      document.getElementById('modal-icon').className = `fa-solid ${data.icon}`;
      document.getElementById('modal-status').textContent = data.status;
      const container = document.getElementById('modal-icon-container');
      container.className = `w-12 h-12 rounded-xl flex items-center justify-center text-xl ${data.bgClass} ${data.colorClass} border ${data.borderClass}`;
      const card = document.getElementById('hud-card');
      card.className = `pointer-events-auto relative w-full max-w-4xl max-h-[85vh] glass-panel rounded-3xl p-6 md:p-8 flex flex-col justify-between overflow-hidden border ${data.borderClass} shadow-2xl transition-all`;
      const modal = document.getElementById('hud-modal');
      modal.classList.remove('pointer-events-none', 'opacity-0', 'scale-95');
      modal.classList.add('opacity-100', 'scale-100');
    }

    function closeHUDModal() {
      const modal = document.getElementById('hud-modal');
      modal.classList.add('pointer-events-none', 'opacity-0', 'scale-95');
      modal.classList.remove('opacity-100', 'scale-100');
    }

    function updateTooltips() {
      for (let key in organelles) {
        const tooltip = document.getElementById(`tooltip-${key}`);
        if (!tooltip) continue;
        if (activeTarget) { tooltip.style.opacity = '0'; continue; }
        const vec = new THREE.Vector3();
        organelles[key].group.getWorldPosition(vec);
        vec.y += 8;
        vec.project(camera);
        if (vec.z > 1) { tooltip.style.opacity = '0'; continue; }
        tooltip.style.left = `${(vec.x * 0.5 + 0.5) * window.innerWidth}px`;
        tooltip.style.top = `${(-(vec.y * 0.5) + 0.5) * window.innerHeight}px`;
        tooltip.style.opacity = '1';
      }
    }

    let time = 0;
    function animate() {
      requestAnimationFrame(animate);
      time += 0.005;
      if (organelles.nucleus) organelles.nucleus.group.rotation.y = time * 0.2;
      if (organelles.mitochondria) organelles.mitochondria.group.rotation.y = time * 0.3;
      if (organelles.golgi) organelles.golgi.group.rotation.y = Math.sin(time) * 0.1;
      if (organelles.cytoskeleton) organelles.cytoskeleton.group.rotation.x = time * 0.1;
      if (cytosolParticles) cytosolParticles.rotation.y = time * 0.02;
      controls.update();
      updateTooltips();
      renderer.render(scene, camera);
    }
  </script>
</body>
  </html>
